kind = "web"
previewPath = "/"
title = "Viniverse – Finances"
version = "1.0.0"
id = "artifacts/viniverse-finances"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20092

[services.development]
run = "pnpm --filter @workspace/viniverse-finances run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/viniverse-finances", "run", "build" ]
publicDir = "artifacts/viniverse-finances/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20092"
BASE_PATH = "/"
