<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <!-- Full bleed background (maskable — no rounded corners) -->
  <rect width="512" height="512" fill="#070d18"/>
  <!-- Subtle radial glow in center -->
  <radialGradient id="bg-glow" cx="50%" cy="40%" r="60%">
    <stop offset="0%" stop-color="#6366f1" stop-opacity="0.08"/>
    <stop offset="100%" stop-color="#070d18" stop-opacity="0"/>
  </radialGradient>
  <rect width="512" height="512" fill="url(#bg-glow)"/>
  <!-- V letterform — padded to stay within maskable safe zone (inner 80%) -->
  <path d="M 160 176 L 256 348 L 352 176"
        stroke="url(#grad)" stroke-width="52"
        stroke-linecap="round" stroke-linejoin="round"
        fill="none"/>
</svg>
