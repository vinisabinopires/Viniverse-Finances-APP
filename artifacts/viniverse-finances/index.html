<!DOCTYPE html>
<html lang="en" style="background:#070d18;">
  <head>
    <meta charset="UTF-8" />

    <!-- Viewport: viewport-fit=cover for iPhone notch / Dynamic Island / home indicator -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary meta -->
    <title>Viniverse – Finances</title>
    <meta name="description" content="Personal finance tracker for income, expenses, goals, budgets, recurring transactions, and net worth." />
    <meta name="application-name" content="Viniverse" />

    <!-- Theme color (dark navy matching app background) -->
    <meta name="theme-color" content="#070d18" />
    <meta name="color-scheme" content="dark" />

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.svg" />

    <!-- Apple / iOS home-screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Viniverse" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/icons/icon-192.svg" />

    <!-- Open Graph / social sharing -->
    <meta property="og:title" content="Viniverse – Finances" />
    <meta property="og:description" content="Personal finance tracker for income, expenses, goals, budgets, recurring transactions, and net worth." />
    <meta property="og:type" content="website" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Prevent white flash: inline dark background on html + body before CSS loads -->
    <style>
      html, body {
        background-color: #070d18;
        color: #f8fafc;
        margin: 0;
        padding: 0;
      }
      #viniverse-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #070d18;
        color: #f8fafc;
        gap: 14px;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        z-index: 9999;
      }
      #viniverse-loader-name {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.4px;
        margin: 0;
        background: linear-gradient(135deg, #6366f1, #a855f7);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      #viniverse-loader-bar {
        width: 32px;
        height: 3px;
        border-radius: 4px;
        background: linear-gradient(90deg, #6366f1, #a855f7);
        animation: vini-pulse 1.4s ease-in-out infinite;
      }
      @keyframes vini-pulse {
        0%, 100% { opacity: 0.35; transform: scaleX(0.55); }
        50%       { opacity: 1;    transform: scaleX(1); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Initial loading state — replaced by React on mount -->
      <div id="viniverse-loader" aria-hidden="true">
        <svg width="60" height="60" viewBox="0 0 192 192" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#6366f1"/>
              <stop offset="100%" stop-color="#a855f7"/>
            </linearGradient>
            <linearGradient id="gw" x1="0.5" y1="0" x2="0.5" y2="1">
              <stop offset="0%" stop-color="#818cf8" stop-opacity="0.2"/>
              <stop offset="100%" stop-color="#070d18" stop-opacity="0"/>
            </linearGradient>
          </defs>
          <rect width="192" height="192" rx="42" fill="#0a0f1e"/>
          <ellipse cx="96" cy="28" rx="80" ry="36" fill="url(#gw)"/>
          <path d="M 46 58 L 96 138 L 146 58"
                stroke="url(#lg)" stroke-width="22"
                stroke-linecap="round" stroke-linejoin="round"
                fill="none"/>
          <circle cx="152" cy="44" r="5" fill="#818cf8" opacity="0.7"/>
        </svg>
        <p id="viniverse-loader-name">Viniverse</p>
        <div id="viniverse-loader-bar"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
